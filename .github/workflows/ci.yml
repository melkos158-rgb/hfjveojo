name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orvionis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orvionis_test?schema=public
      APP_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      SIGNING_SECRET: ci-signing-ci-signing-ci-signing
      STRIPE_SECRET_KEY: sk_test_local
      STRIPE_WEBHOOK_SECRET: whsec_local
      AI_PROVIDER: mock
      EMAIL_PROVIDER: console
      JOBS_INLINE: "true"
      CRON_SECRET: ci-cron
      ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
